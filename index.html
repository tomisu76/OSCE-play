<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSCE Play — Practical Nurse Dialogue</title>
  <style>
    :root {
      --blue: #0f4c81;
      --blue-dark: #082f49;
      --green: #15803d;
      --bg: #f3f8fc;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --border: #d8e5ee;
      --nurse: #e7f2ff;
      --patient: #ecfdf5;
      --shadow: 0 14px 40px rgba(15, 76, 129, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top left, #dbeafe, transparent 34%), var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    header {
      padding: 28px 16px 18px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      letter-spacing: 0.2px;
    }

    header p {
      margin: 0 auto;
      max-width: 900px;
      font-size: clamp(0.95rem, 2.4vw, 1.2rem);
      opacity: 0.95;
    }

    .app {
      width: min(1180px, 96vw);
      margin: 0 auto;
      padding: 18px 0 90px;
    }

    .top-panel {
      display: block;
      max-width: 900px;
      margin: 18px auto;
    }

    .panel-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .panel-card h2 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 1.25rem;
    }

    .patient-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin: 22px auto;
      max-width: 1100px;
    }

    .patient-tab {
      background: white;
      color: var(--blue-dark);
      border: 2px solid var(--border);
      border-radius: 26px;
      padding: 18px;
      min-height: 180px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 76, 129, 0.08);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .patient-tab:hover {
      transform: translateY(-2px);
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .patient-tab.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .patient-tab span { display: block; }

    .patient-number {
      font-size: 0.86rem;
      opacity: 0.76;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .patient-name {
      font-size: 1.35rem;
      font-weight: 900;
      color: inherit;
    }

    .patient-scenario {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      min-height: 42px;
    }

    .patient-tab.active .patient-scenario {
      color: rgba(255, 255, 255, 0.9);
    }

    .play-pill {
      margin-top: 6px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font-size: 1rem;
      font-weight: 900;
    }

    .vital-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.7em;
      margin-right: 0.25em;
      padding: 0.12em 0.45em;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 900;
      font-size: 1em;
      line-height: 1;
      vertical-align: baseline;
    }

    .fullscreen-stage { display: none; }

    .controls {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 999;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
    }

    .controls button {
      border: none;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 900;
      padding: 10px 13px;
      cursor: pointer;
    }

    .controls span {
      min-width: 70px;
      text-align: center;
      font-weight: 900;
      color: var(--blue-dark);
    }

    body.fullscreen-mode {
      overflow: hidden;
      background: #071d33;
    }

    body.fullscreen-mode header,
    body.fullscreen-mode .app { display: none; }

    body.fullscreen-mode .fullscreen-stage {
      display: flex;
      width: 100vw;
      height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    body.fullscreen-mode .controls { display: flex; }

    .fs-slide { display: none; }

    .fs-slide.active {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      animation: fadeIn 0.18s ease-out;
    }

    .fs-card,
    .fs-line {
      width: min(1100px, 96vw);
      max-height: 88vh;
      overflow: auto;
      border-radius: 30px;
      border: 4px solid #60a5fa;
      background: #e8f3ff;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.26);
      padding: clamp(18px, 3vw, 36px);
    }

    .fs-card h2 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: clamp(2rem, 5vw, 5rem);
    }

    .fs-card p {
      margin: 0 0 16px;
      font-size: clamp(1.3rem, 3vw, 2.6rem);
      font-weight: 800;
      color: var(--text);
    }

    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .vital-box {
      text-align: center;
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(10px, 2vw, 20px);
      color: var(--blue-dark);
      font-weight: 900;
      font-size: clamp(1rem, 2vw, 1.7rem);
    }

    .vital-box span {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: clamp(1.4rem, 3vw, 3rem);
    }

    .vital-box small {
      display: block;
      color: var(--muted);
      font-size: clamp(0.8rem, 1.3vw, 1.2rem);
      line-height: 1.2;
      margin-top: 4px;
    }

    .fs-line {
      font-size: clamp(2rem, 5.3vw, 4.8rem);
      line-height: 1.18;
    }

    .fs-line.patient {
      background: #dcfce7;
      border-color: #4ade80;
    }

    .speaker {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--blue-dark);
      font-size: 0.5em;
      margin-bottom: 10px;
    }

    .patient .speaker { color: #166534; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 920px) {
      .patient-tabs { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      header { padding: 24px 12px 16px; }
      .patient-tabs { grid-template-columns: 1fr; }
      .vitals-grid { grid-template-columns: repeat(2, 1fr); }
      .fs-line {
        width: 100vw;
        font-size: clamp(1.9rem, 9vw, 4rem);
        border-radius: 24px;
      }
      .controls {
        width: 96vw;
        justify-content: center;
        bottom: 8px;
        gap: 5px;
      }
      .controls button {
        font-size: 0.78rem;
        padding: 8px 9px;
      }
      .controls span {
        min-width: 52px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>

          ['nurse', '<span class="vital-tag">BP</span>Your BP (blood pressure) is 122/78 mmHg (one hundred twenty-two over seventy-eight).'],
          ['nurse', '<span class="vital-tag">RR</span>Your respiratory rate is 18 breaths/min (eighteen breaths per minute).'],
          ['nurse', '<span class="vital-tag">PR</span>Your pulse rate is 82 beats/min (eighty-two beats per minute).'],
          ['nurse', '<span class="vital-tag">BT</span>Your body temperature is 37.0 °C (thirty-seven point zero degrees Celsius).'],
          ['nurse', '<span class="vital-tag">O2 sat</span>Your oxygen saturation is 99% (ninety-nine percent).'],
          ['nurse', 'Please wait for the doctor for a few minutes. The minor surgery room is on the 1st floor (first floor).'],
          ['nurse', 'Your next appointment is on July 9 at 9:00 a.m. (July ninth at nine a.m.).'],
          ['patient', 'Thank you very much.'],
          ['nurse', 'You’re welcome. Have a good day.'],
          ['patient', 'Goodbye.']
        ]
      }
    ];

    let currentPatient = 1;
    let fsSlides = [];
    let currentSlide = 0;

    const fullscreenStage = document.getElementById('fullscreenStage');
    const slideCounter = document.getElementById('slideCounter');

    function getPatient(id = currentPatient) {
      return patients.find(patient => patient.id === id) || patients[0];
    }

    function renderPatient(id) {
      currentPatient = id;
      document.querySelectorAll('.patient-tab').forEach(button => {
        button.classList.toggle('active', Number(button.dataset.patient) === id);
      });
    }

    function buildFullScreenSlides() {
      const patient = getPatient();
      fullscreenStage.innerHTML = '';

      const intro = document.createElement('article');
      intro.className = 'fs-slide';
      intro.dataset.speaker = 'intro';
      intro.innerHTML = `
        <div class="fs-card">
          <h2>Patient ${patient.id} — ${patient.name}</h2>
          <p>${patient.scenario}</p>
          <div class="vitals-grid">
            ${patient.vitals.map(([label, value, words, unit]) => `
              <div class="vital-box">${label} (${unit})<span>${value}</span><small>${words}</small></div>
            `).join('')}
          </div>
        </div>
      `;
      fullscreenStage.appendChild(intro);

      patient.lines.forEach(([speaker, text], index) => {
        const slide = document.createElement('article');
        slide.className = 'fs-slide';
        slide.dataset.speaker = speaker;
        slide.dataset.voice = AUDIO_VOICES[speaker];
        slide.dataset.audioId = `p${String(patient.id).padStart(2, '0')}_s${String(index + 1).padStart(3, '0')}`;
        slide.innerHTML = `<div class="fs-line ${speaker}"><span class="speaker">${speaker === 'nurse' ? 'Practical nurse' : 'Patient'}</span>${text}</div>`;
        fullscreenStage.appendChild(slide);
      });

      fsSlides = Array.from(document.querySelectorAll('.fs-slide'));
    }

    function updateSlide() {
      fsSlides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentSlide);
      });
      slideCounter.textContent = `${currentSlide + 1} / ${fsSlides.length}`;
    }

    function startPatientSlides() {
      buildFullScreenSlides();
      currentSlide = 0;
      document.body.classList.add('fullscreen-mode');
      updateSlide();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    function exitSlides() {
      document.body.classList.remove('fullscreen-mode');
      fullscreenStage.innerHTML = '';
      fsSlides = [];
      currentSlide = 0;

      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function nextSlide() {
      if (!fsSlides.length) return;
      currentSlide = (currentSlide + 1) % fsSlides.length;
      updateSlide();
    }

    function previousSlide() {
      if (!fsSlides.length) return;
      currentSlide = (currentSlide - 1 + fsSlides.length) % fsSlides.length;
      updateSlide();
    }

    document.querySelectorAll('.patient-tab').forEach(button => {
      button.addEventListener('click', () => {
        renderPatient(Number(button.dataset.patient));
        startPatientSlides();
      });
    });

    document.addEventListener('keydown', event => {
      if (!document.body.classList.contains('fullscreen-mode')) return;

      if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'PageDown') {
        event.preventDefault();
        nextSlide();
      }

      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        previousSlide();
      }

      if (event.key === 'Escape') {
        exitSlides();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && document.body.classList.contains('fullscreen-mode')) {
        document.body.classList.remove('fullscreen-mode');
        fullscreenStage.innerHTML = '';
        fsSlides = [];
      }
    });

    renderPatient(1);
  </script>
</body>
</html>
